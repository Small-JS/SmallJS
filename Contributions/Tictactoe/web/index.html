<!DOCTYPE html>

<html lang="en-GB">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tic-Tac-Toe</title>
	<link rel="stylesheet" href="default.css" type="text/css" />
	<script src="Script/main.js"></script>
</head>

<body>
	<table id="formTable">
		<tr>
			<td class="title">
				<div class="vertical-center">
					<img id="logoImage" src="logo.png" height="40" alt="Tic-Tac-Toe logo"></img>
					<span id="titleMessage">&nbsp;&nbsp;Tic-Tac-Toe</span>
				</div>
			</td>
		</tr>
		<tr>
			<td>
				<table id="boardTable">
					<tbody></tbody>
				</table>
			</td>
		</tr>
		<tr>
			<td>
				<span id="statusSpan">Your turn</span>
			</td>
		</tr>
		<tr>
			<td>
				<button id="newGameButton">New game</button>
			</td>
		</tr>
	</table>

</body>

</html>
