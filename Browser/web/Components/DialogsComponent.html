<tr>
	<th scope="row">
		<p class="field">Dialogs</p>
	</th>
	<td>
		<button id="popupButton">Popup</button>
		<button id="alertButton">Alert</button>
		<button id="confirmButton">Confirm</button>
		<button id="promptButton">Prompt</button>
		<button id="printButton">Print</button>
		<button id="dialogButton">Dialog</button>
		<dialog id="dialog">
			<form method="dialog">
				<p>My Dialog</p>
				<button id="dialogOkButton" value="OK">OK</button>
				<button id="dialogCancelButton" value="Cancel">Cancel</button>
			</form>
		</dialog>
	</td>
	<td>
		<p id="dialogResultParagraph">[dialog result]</p>
	</td>
</tr>
